name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 5 * * *'   # daily rebuild so future-dated posts go live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # G-30: the blog lives at www.relomatrix.com/blog/ (built there from this repo) and this host only
      # redirects there. It used to fall back to the full blog, with blog.relomatrix.com as canonical,
      # whenever relomatrix.com/blog/ did not answer within 30 s: a single slow check would put every
      # article back on Google under both hosts. The redirect shell is now the only output.
      - name: Check that relomatrix.com/blog/ serves the blog (warning only)
        run: |
          html="$(curl -fsSL --max-time 30 https://www.relomatrix.com/blog/ || true)"
          if printf '%s' "$html" | grep -q 'name="relomatrix-blog" content="embedded"'; then
            echo "relomatrix.com/blog/ is live" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::relomatrix.com/blog/ did not answer with the blog marker; deploying the redirect shell anyway"
          fi
      - name: Build (canonical www.relomatrix.com, redirect shell for this host)
        env:
          # The old host lists (sitemap, RSS) only the posts already live on relomatrix.com/blog/.
          BLOG_SHELL_MIRROR_LIVE: '1'
        run: npm run build
      - run: test -f out-redirect/index.html && echo "Deploying redirect" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out-redirect
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
